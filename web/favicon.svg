<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <g id="ramapillar">
      <rect x="1.5" y="1.5" width="27.5" height="27.5" rx="6.5" fill="#1A0E24" stroke="#8A5890" stroke-width="1.4" />
      <!-- Sparkles -->
      <path d="M25 5 L25.6 6.5 L27.1 7.1 L25.6 7.7 L25 9.2 L24.4 7.7 L22.9 7.1 L24.4 6.5 Z" fill="#FFD166" />
      <circle cx="5.8" cy="24" r="1" fill="#F48FB1" />
      <!-- Ram horns -->
      <circle cx="8.2" cy="10.8" r="4.3" fill="#FF9EBB" stroke="#4A2040" stroke-width="1.4" />
      <path d="M7.2 11 A1.6 1.6 0 1 1 9.4 11.9" fill="none" stroke="#4A2040" stroke-width="1.1" stroke-linecap="round" />
      <circle cx="22.3" cy="10.8" r="4.3" fill="#FF9EBB" stroke="#4A2040" stroke-width="1.4" />
      <path d="M23.3 11 A1.6 1.6 0 1 0 21.1 11.9" fill="none" stroke="#4A2040" stroke-width="1.1" stroke-linecap="round" />
      <!-- Head -->
      <ellipse cx="15.25" cy="17" rx="8.5" ry="7.6" fill="#FFE8EE" stroke="#4A2040" stroke-width="1.4" />
      <!-- Blush -->
      <ellipse cx="10" cy="17.8" rx="1.7" ry="1" fill="#FF8FAB" opacity="0.85" />
      <ellipse cx="20.5" cy="17.8" rx="1.7" ry="1" fill="#FF8FAB" opacity="0.85" />
      <!-- Happy eyes -->
      <path d="M10.8 15.6 Q12.1 14 13.4 15.6" fill="none" stroke="#4A2040" stroke-width="1.4" stroke-linecap="round" />
      <path d="M17.1 15.6 Q18.4 14 19.7 15.6" fill="none" stroke="#4A2040" stroke-width="1.4" stroke-linecap="round" />
      <!-- :3 mouth -->
      <path d="M13.4 17.6 Q14.3 18.9 15.25 17.6 Q16.2 18.9 17.1 17.6" fill="none" stroke="#4A2040" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Top-right jigsaw piece -->
    <clipPath id="tr-piece">
      <path d="M15.25 0 H32 V15.5 H24.5 A2.1 2.1 0 1 1 20.5 15.5 H15.25 V10.2 A2.1 2.1 0 1 0 15.25 6.2 Z" />
    </clipPath>

    <!-- Remaining 3 jigsaw pieces -->
    <clipPath id="rest-pieces">
      <path d="M0 0 H15.25 V6.2 A2.1 2.1 0 1 1 15.25 10.2 V15.5 H20.5 A2.1 2.1 0 1 0 24.5 15.5 H32 V32 H0 Z" />
    </clipPath>
  </defs>

  <!-- Main 3 pieces + jigsaw seams -->
  <g clip-path="url(#rest-pieces)">
    <use href="#ramapillar" />
    <path d="M1.5 15.5 H7 A2.1 2.1 0 1 1 11 15.5 H15.25 V20.5 A2.1 2.1 0 1 0 15.25 24.5 V29"
          fill="none" stroke="#1A0E24" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Popped top-right jigsaw piece -->
  <g clip-path="url(#tr-piece)" transform="translate(1.5, -1.5)">
    <use href="#ramapillar" />
    <path d="M15.25 1.5 V6.2 A2.1 2.1 0 1 0 15.25 10.2 V15.5 H20.5 A2.1 2.1 0 1 1 24.5 15.5 H29"
          fill="none" stroke="#00F5D4" stroke-width="1.1" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
